[package]
name = "metronomic"
version = "0.1.0"
edition = "2021"
description = "Losslessly regularize noisy, nearly-periodic timestamps onto a grid plus residuals"
license = "MIT"
repository = "https://github.com/withtwoemms/metronomic"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.9"
