[project]
name = "metronomic"
version = "0.1.0"
description = "Losslessly regularize noisy, nearly-periodic timestamps onto a grid plus residuals"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Emmanuel I. Obi", email = "withtwoemms@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Archiving :: Compression",
]
dependencies = [
    "click>=8.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
metronomic = "metronomic.cli:cli"

[project.urls]
Repository = "https://github.com/withtwoemms/metronomic"

[project.optional-dependencies]
test = ["pytest>=7.0", "coverage[toml]>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["metronomic"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"
